name: eval

on:
  push:
  pull_request:

jobs:
  # Always-on: the offline unit suite runs with no API key via the mock provider.
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (with dev deps)
        run: pip install -e ".[dev]"
      - name: Run offline test suite (the quality gate on harness logic)
        run: pytest

  # Opt-in: the live eval + regression gate runs only when a key secret is set.
  live-gate:
    runs-on: ubuntu-latest
    needs: offline-tests
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (live extras)
        run: pip install -e ".[all]"
      - name: Skip if no API key
        id: keycheck
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "No ANTHROPIC_API_KEY secret set — skipping live gate."
          elif [ ! -f examples/baseline.json ]; then
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "No examples/baseline.json committed — run 'evalharness baseline' and commit it to enable the live gate."
          else
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run eval gate against committed baseline
        if: steps.keycheck.outputs.have_key == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Exits non-zero on a quality regression → fails the PR check.
        run: evalharness gate examples/suite.yaml --baseline examples/baseline.json --html report.html
      - name: Upload HTML report
        if: always() && steps.keycheck.outputs.have_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: report.html
