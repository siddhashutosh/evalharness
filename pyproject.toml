[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalharness"
version = "1.0.0"
description = "A reusable LLM evaluation harness: golden test sets, LLM-as-judge scoring, regression detection, and a CI quality gate."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "evalharness" }]
keywords = ["llm", "evaluation", "eval", "anthropic", "claude", "testing", "ci", "regression"]

dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    # Lets Pydantic evaluate `X | None` annotations on Python 3.9.
    "eval_type_backport>=0.2; python_version < '3.10'",
]

[project.optional-dependencies]
# Live scoring against Anthropic.
anthropic = ["anthropic>=0.40"]
# Local semantic-similarity scorer (offline, no API key).
embedding = ["sentence-transformers>=2.2"]
# Everything for a full live run.
all = ["anthropic>=0.40", "sentence-transformers>=2.2"]
# Development / testing.
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
evalharness = "evalharness.cli:app"

[project.urls]
Documentation = "https://example.com/evalharness/docs"

[tool.hatch.build.targets.wheel]
packages = ["evalharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
